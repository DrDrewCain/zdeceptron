[package]
name = "zdc-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# Published so `cargo install zdc-cli` works: the binary is one compiler, but
# reaching it from crates.io means every crate it links is on crates.io too.
# Path dependencies therefore carry a version as well as a path — the path is
# what a workspace build uses, the version is what a published build resolves.
# Dev-dependencies stay path-only on purpose: cargo omits a version-less
# dev-dependency from the published manifest, which is what lets the test-only
# edges between these crates form cycles the publish order does not have to
# break.
description = "The `zdc dev` development server: build, watch, serve, live-reload."

[dependencies]
# A blocking HTTP/1.1 server in pure Rust. Its whole dependency set
# (`ascii`, `chunked_transfer`, `httpdate`, `log`) is pure Rust too: nothing
# in the tree compiles a C source or links a native library, so `zdc` stays
# the single static binary spec §7 promises. Blocking rather than async is
# deliberate — a dev server handles one developer, and an async runtime
# would be a larger dependency than the server it hosts.
tiny_http = { version = "0.12", default-features = false }
zdc-codegen = { path = "../zdc-codegen", version = "0.2.0" }
zdc-diagnostics = { path = "../zdc-diagnostics", version = "0.2.0" }
zdc-graph = { path = "../zdc-graph", version = "0.2.0" }
# The dev server does not serve the emitted server functions as static
# text any more: it runs them. `zdc-host` binds `$env` and `$store`,
# `zdc-store` is what `$store` writes to.
zdc-host = { path = "../zdc-host", version = "0.2.0" }
zdc-lib = { path = "../zdc-lib", version = "0.2.0" }
zdc-parser = { path = "../zdc-parser", version = "0.2.0" }
zdc-resolve = { path = "../zdc-resolve", version = "0.2.0" }
# For the wire format's version and the two names it travels under (#144).
# The dev server refuses a mismatched request before any JavaScript starts,
# so it needs the constant in Rust rather than out of the engine.
zdc-runtime = { path = "../zdc-runtime", version = "0.2.0" }
zdc-store = { path = "../zdc-store", version = "0.2.0" }
zdc-types = { path = "../zdc-types", version = "0.2.0" }

[dev-dependencies]
zdc-graph = { path = "../zdc-graph" }
# The live-reload client is JavaScript this crate emits, so it needs the
# same treatment as the rest of the runtime (spec §14E.2): a pure-Rust
# engine runs it under `cargo test`, and verifying it installs nothing.
boa_engine = "0.21"
# The integration tests re-run the exact pipeline `zdc build` runs, so that
# "the dev server reports what the CLI reports" is checked against the
# other implementation rather than against a copy of its wording.
zdc-codegen = { path = "../zdc-codegen" }
zdc-diagnostics = { path = "../zdc-diagnostics" }
zdc-host = { path = "../zdc-host" }
zdc-lib = { path = "../zdc-lib" }
zdc-parser = { path = "../zdc-parser" }
zdc-resolve = { path = "../zdc-resolve" }
zdc-store = { path = "../zdc-store" }
zdc-types = { path = "../zdc-types" }
