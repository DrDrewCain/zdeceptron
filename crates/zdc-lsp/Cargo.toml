[package]
name = "zdc-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# Published so `cargo install zdc-cli` works: the binary is one compiler, but
# reaching it from crates.io means every crate it links is on crates.io too.
# Path dependencies therefore carry a version as well as a path — the path is
# what a workspace build uses, the version is what a published build resolves.
# Dev-dependencies stay path-only on purpose: cargo omits a version-less
# dev-dependency from the published manifest, which is what lets the test-only
# edges between these crates form cycles the publish order does not have to
# break.
description = "A Language Server Protocol server that asks the ZDeceptron compiler instead of guessing."

[dependencies]
# rust-analyzer's own transport and protocol types. Both are pure Rust —
# nothing in either tree compiles a C source or links a native library —
# so `zdc` stays the single static binary spec §7 promises.
#
# `lsp-server` is a blocking JSON-RPC loop over stdio built on
# crossbeam-channel, which is the same choice `zdc-dev` made and for the
# same reason: a language server serves one editor, and every compiler
# pass it calls is synchronous, so an async runtime would be a larger
# dependency than the thing it hosts. The two crates together pull 19
# packages; the async alternative pulls 80.
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

zdc-ast = { path = "../zdc-ast", version = "0.1.1" }
# The editor must show every diagnostic the command line shows, and codegen
# owns fifty-odd of them (§16.3.5, §16.3.6, §16.5). Analysing a file
# therefore runs the emitter and drops its output, exactly as `zdc check`
# does; see `analysis.rs` for what that costs per keystroke.
zdc-codegen = { path = "../zdc-codegen", version = "0.1.1" }
zdc-diagnostics = { path = "../zdc-diagnostics", version = "0.1.1" }
# For `zdc_doc::prose`. The hover text and the generated documentation say the
# same things about the same declarations, and two copies of "what does
# `durable` mean" would agree on the day the second was written and drift
# apart afterwards with nothing comparing them. One implementation, so the
# editor and the pages cannot disagree.
zdc-doc = { path = "../zdc-doc", version = "0.1.1" }
# The one canonical layout, so `textDocument/formatting` and `zdc fmt` cannot
# lay the same file out two ways. The editor asks the formatter the command
# line runs rather than reimplementing it against the same spec.
zdc-fmt = { path = "../zdc-fmt", version = "0.1.1" }
zdc-graph = { path = "../zdc-graph", version = "0.1.1" }
zdc-hir = { path = "../zdc-hir", version = "0.1.1" }
zdc-lib = { path = "../zdc-lib", version = "0.1.1" }
zdc-lexer = { path = "../zdc-lexer", version = "0.1.1" }
zdc-parser = { path = "../zdc-parser", version = "0.1.1" }
zdc-resolve = { path = "../zdc-resolve", version = "0.1.1" }
zdc-types = { path = "../zdc-types", version = "0.1.1" }
