[package]
name = "zdc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zdc"
path = "src/main.rs"

[dependencies]
clap.workspace = true
zdc-ast = { path = "../zdc-ast" }
zdc-codegen = { path = "../zdc-codegen" }
zdc-deploy = { path = "../zdc-deploy" }
zdc-dev = { path = "../zdc-dev" }
zdc-diagnostics = { path = "../zdc-diagnostics" }
zdc-graph = { path = "../zdc-graph" }
zdc-hir = { path = "../zdc-hir" }
zdc-lib = { path = "../zdc-lib" }
zdc-lsp = { path = "../zdc-lsp" }
zdc-parser = { path = "../zdc-parser" }
zdc-resolve = { path = "../zdc-resolve" }
zdc-types = { path = "../zdc-types" }

[dev-dependencies]
# `zdc lsp` is tested by speaking the protocol to it over a pipe, framing
# and all, rather than by calling the crate it wraps: what an editor
# actually depends on is the subcommand, and a test that bypassed the
# process would not notice it failing to start.
serde_json = "1"
