[package]
name = "zdc-deploy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# Published so `cargo install zdc-cli` works: the binary is one compiler, but
# reaching it from crates.io means every crate it links is on crates.io too.
# Path dependencies therefore carry a version as well as a path — the path is
# what a workspace build uses, the version is what a published build resolves.
# Dev-dependencies stay path-only on purpose: cargo omits a version-less
# dev-dependency from the published manifest, which is what lets the test-only
# edges between these crates form cycles the publish order does not have to
# break.
description = "Generates per-platform deploy adapters and configuration from a compiled ZDeceptron bundle."

[dependencies]
zdc-codegen = { path = "../zdc-codegen", version = "0.1.1" }
# For `WIRE_JS` and nothing else. A deployment ships the runtime's own wire
# format rather than an adapter's copy of the rules, which is the whole
# argument of that file's header. `default-features = false` leaves the
# JavaScript engine behind: this crate holds text, it never runs any.
# For `WIRE_JS` and nothing else. A deployment ships the runtime's own wire
# format rather than an adapter's copy of the rules, which is the whole
# argument of that file's header. `default-features = false` leaves the
# JavaScript engine behind: this crate holds text, it never runs any.
zdc-runtime = { path = "../zdc-runtime", version = "0.1.1", default-features = false }

[dev-dependencies]
# Generated JavaScript is parsed here rather than merely string-matched: the
# shims are hand-written and copied verbatim, so nothing else in the build
# would notice a syntax error in one until a platform did.
boa_engine = "0.21"
zdc-graph = { path = "../zdc-graph" }
# `zdc dev`'s runner, so a deployed answer can be compared against the one a
# developer tested against rather than against a second expectation written
# here. The two disagreeing is the bug `tests/wire_format.rs` is about.
zdc-host = { path = "../zdc-host" }
zdc-parser = { path = "../zdc-parser" }
zdc-resolve = { path = "../zdc-resolve" }
zdc-store = { path = "../zdc-store" }
zdc-types = { path = "../zdc-types" }
