[package]
name = "zdc-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# Published so `cargo install zdc-cli` works: the binary is one compiler, but
# reaching it from crates.io means every crate it links is on crates.io too.
# Path dependencies therefore carry a version as well as a path — the path is
# what a workspace build uses, the version is what a published build resolves.
# Dev-dependencies stay path-only on purpose: cargo omits a version-less
# dev-dependency from the published manifest, which is what lets the test-only
# edges between these crates form cycles the publish order does not have to
# break.
description = "Counts the js-framework-benchmark workload against the emitted runtime, and fails the build when the numbers regress."

[dependencies]
# The same pure-Rust engine the runtime's own tests use. The benchmark must
# run under `cargo test` with nothing else installed (spec §14A.4), which
# rules out Node, a browser, and therefore React and SolidJS.
boa_engine = "0.21"
zdc-codegen = { path = "../zdc-codegen", version = "0.1.0" }
zdc-graph = { path = "../zdc-graph", version = "0.1.0" }
zdc-parser = { path = "../zdc-parser", version = "0.1.0" }
zdc-resolve = { path = "../zdc-resolve", version = "0.1.0" }
zdc-types = { path = "../zdc-types", version = "0.1.0" }
zdc-runtime = { path = "../zdc-runtime", version = "0.1.0" }

[dev-dependencies]
# Only the fidelity test looks at the tree the parser built, and it looks
# because "the literal parses" and "the literal parses into a list" are
# different claims.
zdc-ast = { path = "../zdc-ast" }
