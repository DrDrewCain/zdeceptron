[package]
name = "zdc-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Renders ZDeceptron diagnostics: the claim, the span, and the rule behind the code."
# Published so `cargo install zdc-cli` works: the binary is one compiler, but
# reaching it from crates.io means every crate it links is on crates.io too.
# Path dependencies therefore carry a version as well as a path — the path is
# what a workspace build uses, the version is what a published build resolves.
# Dev-dependencies stay path-only on purpose: cargo omits a version-less
# dev-dependency from the published manifest, which is what lets the test-only
# edges between these crates form cycles the publish order does not have to
# break.

[dependencies]
ariadne.workspace = true
# One type is wanted from here — `CodegenError`, so a refusal from the
# emitter renders like every other diagnostic — and `default-features =
# false` says so. Left at the default this edge would switch
# `zdc-codegen/evaluate` back on for anything that renders a diagnostic,
# which is everything, and the JavaScript engine would come back with it:
# feature unification is per dependency *graph*, so one manifest asking
# for the default re-enables it for every crate in the build. Rendering a
# diagnostic does not need an interpreter.
zdc-codegen = { path = "../zdc-codegen", version = "0.1.0", default-features = false }
zdc-graph = { path = "../zdc-graph", version = "0.1.0" }
zdc-lexer = { path = "../zdc-lexer", version = "0.1.0" }
zdc-parser = { path = "../zdc-parser", version = "0.1.0" }
zdc-resolve = { path = "../zdc-resolve", version = "0.1.0" }
zdc-types = { path = "../zdc-types", version = "0.1.0" }

[dev-dependencies]
# The JSON form is checked by parsing it with a real JavaScript engine
# rather than by asserting on the text this crate produced, which would
# only restate the escaping rules against themselves. `boa_engine` is
# already in this workspace's dependency graph — `zdc-codegen` and
# `zdc-host` both link it — so this edge adds a test, not a supply chain.
boa_engine = "0.21"
