[package]
name = "zdc-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# Published so `cargo install zdc-cli` works: the binary is one compiler, but
# reaching it from crates.io means every crate it links is on crates.io too.
# Path dependencies therefore carry a version as well as a path — the path is
# what a workspace build uses, the version is what a published build resolves.
# Dev-dependencies stay path-only on purpose: cargo omits a version-less
# dev-dependency from the published manifest, which is what lets the test-only
# edges between these crates form cycles the publish order does not have to
# break.
description = "The platform adapter (§8.2): binds `$env` and `$store` and executes emitted server functions."

[dependencies]
# The same pure-Rust engine `zdc-runtime` uses to verify the client half.
# A server function is JavaScript, and the only way to find out whether it
# runs is to run it (spec §7: nothing else to install).
boa_engine = "0.21"
# The wire format is one definition shared with the browser: `wire.js`
# is embedded here and evaluated into the prelude, so the adapter and
# the page cannot disagree about what a `Map` looks like as JSON.
zdc-runtime = { path = "../zdc-runtime", version = "0.1.0" }
zdc-store = { path = "../zdc-store", version = "0.1.0" }

[dev-dependencies]
zdc-codegen = { path = "../zdc-codegen" }
zdc-graph = { path = "../zdc-graph" }
zdc-parser = { path = "../zdc-parser" }
zdc-resolve = { path = "../zdc-resolve" }
zdc-types = { path = "../zdc-types" }
