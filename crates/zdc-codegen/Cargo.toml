[package]
name = "zdc-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
# One compiler, not fourteen libraries: these depend on each other by path
# with no version requirement, which `cargo deny` allows only for a crate
# that is never published.
publish = false
description = "Emits JavaScript and CSS from resolved ZDeceptron HIR."

[dependencies]
zdc-ast = { path = "../zdc-ast" }
zdc-graph = { path = "../zdc-graph" }
zdc-hir = { path = "../zdc-hir" }
zdc-lexer = { path = "../zdc-lexer" }
zdc-runtime = { path = "../zdc-runtime" }
zdc-types = { path = "../zdc-types" }

[dev-dependencies]
boa_engine = "0.21"
zdc-graph = { path = "../zdc-graph" }
zdc-parser = { path = "../zdc-parser" }
zdc-resolve = { path = "../zdc-resolve" }
zdc-types = { path = "../zdc-types" }
