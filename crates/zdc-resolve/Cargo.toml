[package]
name = "zdc-resolve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Binds every name in a ZDeceptron program and lowers it to HIR."
# Published so `cargo install zdc-cli` works: the binary is one compiler, but
# reaching it from crates.io means every crate it links is on crates.io too.
# Path dependencies therefore carry a version as well as a path — the path is
# what a workspace build uses, the version is what a published build resolves.
# Dev-dependencies stay path-only on purpose: cargo omits a version-less
# dev-dependency from the published manifest, which is what lets the test-only
# edges between these crates form cycles the publish order does not have to
# break.

[dependencies]
zdc-ast = { path = "../zdc-ast", version = "0.1.0" }
zdc-hir = { path = "../zdc-hir", version = "0.1.0" }
zdc-lexer = { path = "../zdc-lexer", version = "0.1.0" }
zdc-parser = { path = "../zdc-parser", version = "0.1.0" }

[dev-dependencies]
# Development-only, and only so the tests below can check a cross-module
# read against the *real* placement pass: §17.1.2 runs the split before the
# checker, so a stand-in here would be asserting against a different
# compiler from the one that ships.
zdc-graph = { path = "../zdc-graph" }
zdc-types = { path = "../zdc-types" }
