[package]
name = "zdc-types"
version.workspace = true
edition.workspace = true
license.workspace = true
# One compiler, not fourteen libraries: these depend on each other by path
# with no version requirement, which `cargo deny` allows only for a crate
# that is never published.
publish = false
description = "Hindley-Milner type inference and checking over resolved ZDeceptron HIR."

[dependencies]
zdc-ast = { path = "../zdc-ast" }
zdc-hir = { path = "../zdc-hir" }
zdc-lexer = { path = "../zdc-lexer" }

[dev-dependencies]
# A development-only cycle, and a deliberate one: the tests below check
# this crate against the *real* placement pass rather than against a
# hand-written stand-in, which is the whole point of §17.1.4's interface.
zdc-graph = { path = "../zdc-graph" }
zdc-parser = { path = "../zdc-parser" }
zdc-resolve = { path = "../zdc-resolve" }
