name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything here is a property of the *source*, not of the machine it
  # runs on: whether it is formatted, whether clippy is happy, whether any
  # crate has stopped forbidding unsafe, whether the editor grammar still
  # matches the lexer. None of that can come out differently on macOS than
  # on Linux, so none of it is in the `test` matrix below — running the
  # same six scripts, plus `fmt` and `clippy`, on three runners would
  # triple the bill and could only ever produce three identical answers.
  #
  # The test suite used to be the last step of this job. It moved to
  # `test`, because whether the compiler *works* is emphatically not a
  # property of the source alone (#163).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # For the playground (#171). Both, and for different reasons —
          # see the step at the end of this job.
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Every crate forbids unsafe
        run: ./scripts/check-forbid-unsafe.sh
      - name: No wildcard match arm over a closed compiler enum
        run: ./scripts/check-wildcard-arms.sh
      - name: No test that cannot fail
        run: python3 ./scripts/check-vacuous-tests.py
      - name: No emitter writes its own quotes around a placeholder
        run: ./scripts/check-emitted-strings.sh
      # The inline budget, held for every message the compiler can build
      # rather than only for the ones a fixture can provoke.
      # `crates/zdc-diagnostics/tests/inline_budget.rs` measures what a
      # reader actually sees and reaches the codes the grammar reaches;
      # this measures the message as written and reaches all of them,
      # which is where the paragraphs that predate the budget are.
      - name: No diagnostic message exceeds the inline budget
        run: python3 ./scripts/check-message-budget.py
      - name: Editor grammar matches the lexer keyword table
        run: python3 ./scripts/check-grammar-drift.py
      # The release publishes twenty crates in dependency order, and that
      # order is computed rather than written down. Checked here so a
      # dependency edge that makes it uncomputable fails on the pull
      # request that adds it, not half way through a release with some
      # crates already published and no way to unpublish them.
      - name: A publish order exists
        run: python3 ./scripts/publish-order.py --check

      # `install.sh` could not be run end to end until there was a release
      # to install from, so its first real execution was after v0.1.0 went
      # out — and it failed immediately. See the script for what and why.
      - name: The installer is a shell script that runs
        run: ./scripts/check-installer.sh
      # Whether the examples are laid out canonically is a property of the
      # source and not of the machine, so it belongs beside the other
      # source properties rather than in a per-platform matrix: three
      # runners could only ever return the same answer (#167).
      #
      # `cargo test` asserts this too, through the library. This asserts
      # it through the binary a person actually runs, and through its exit
      # code, which is the whole of what a CI job or a pre-commit hook
      # depends on.
      #
      # `find` rather than `examples/*.zd`: the glob omits
      # `examples/tree/tree.zd`, which is the one example in a directory
      # of its own and therefore the one most likely to be missed.
      - name: The examples are in the canonical layout
        run: cargo run --quiet -p zdc-cli -- fmt --check $(find examples -name '*.zd' | sort)

      # The playground (#171), which is the one thing here that a normal
      # `cargo build` cannot break loudly: nothing in the default target
      # links `zdc-wasm`, so a dependency added to `zdc-codegen` or
      # `zdc-diagnostics` that reaches the filesystem — or reaches
      # `boa_engine` through the `evaluate` feature the seam exists to keep
      # optional — would compile everywhere, pass every gate, and be found
      # by a reader opening the page.
      #
      # Both targets, because they answer different questions. `wasip1` is
      # what the page runs, so it is the build that has to keep working.
      # `wasm32-unknown-unknown` is the harsher one: it has no host
      # interface at all, so it proves the front end reaches no syscall by
      # any route. A crate that quietly starts reading files fails there
      # first.
      - name: The compiler still builds for the browser
        run: |
          cargo build --release --target wasm32-wasip1 -p zdc-wasm
          cargo build --release --target wasm32-unknown-unknown -p zdc-wasm --lib

  # The test suite, on every operating system the release ships a binary
  # for (#163).
  #
  # Until this existed CI was `ubuntu-latest` and nothing else, and the
  # cost of that was paid in full on the first run of the release
  # workflow: the compiler could not compile its own examples on Windows.
  # Git there defaults to `core.autocrlf=true` and rewrote LF to CRLF on
  # checkout, and the lexer refused a carriage return — so every one of
  # the twenty-eight examples was rejected by the binary built beside
  # them. Not a corner case, and not a new bug either. It had been true
  # for as long as the lexer had that rule, and it was invisible for
  # exactly as long as CI had one platform. That was #242. This job is so
  # the next one of those is found by a pull request instead of by a
  # release.
  #
  # The three runners are the three host operating systems, which is not
  # the same as the five targets `release.yml` builds. A test suite has to
  # *run*, and two of those five cannot run where they are built — the
  # macOS runners are arm64 without Rosetta, and aarch64-Linux is
  # cross-compiled on an x86_64 host. `release.yml` records the same fact
  # as `smoke: false` on those two entries. Covering them would mean an
  # emulator or self-hosted hardware, which is a much larger thing to own
  # than this issue asked for, and the untested axis there is the CPU
  # rather than the OS: the platform differences that have actually bitten
  # this project — line endings, path separators, file locking — are
  # differences between operating systems, and all three are here.
  #
  # `ubuntu-latest` tests glibc where the release ships musl. That is a
  # gap and it is a small one: `cargo test` exercises the compiler's own
  # logic, and the musl choice is about which libc a *user's* machine has
  # to provide, which the release job's smoke test on the musl artefact is
  # the right place to check — and does.
  #
  # The cost. On a public repository these runners are free, so what is
  # being spent is wall-clock and queue time rather than money. That is
  # worth saying plainly, because if this repository ever goes private the
  # arithmetic changes sharply: GitHub bills Windows at 2x and macOS at
  # 10x the Linux rate per minute. Even then the trade would stand — one
  # whole platform silently broken cost more than these minutes — but it
  # would be a trade someone should re-examine rather than inherit. The
  # thing that keeps it affordable now is the split above: the test suite
  # is the only thing that runs three times, because it is the only thing
  # whose answer can differ.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others. Which platforms
      # are broken is the whole information this job exists to produce,
      # and the default would report one of them and abandon the rest —
      # turning "Windows and macOS are both broken" into "something is
      # broken", which is what we already knew. `release.yml`'s matrix
      # says the same thing for the same reason.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # No line-ending configuration here on purpose. `.gitattributes`
      # pins `eol=lf` for every text type, so the checkout is
      # byte-identical on all three runners and the tests that compare
      # emitted output byte for byte compare the same bytes everywhere. A
      # `git config core.autocrlf` in this job would fix the checkout and
      # hide the thing the file is there to guarantee.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # Default fail-fast hides every later suite behind one failure,
      # which is how a green-looking run once covered twelve broken tests.
      # It matters more here than it did as a single job: a cross-platform
      # difference is rarely one test, and a Windows run that stopped at
      # the first path-separator failure would report one broken suite out
      # of nineteen and look almost like a pass. The whole point is to
      # learn how much of the compiler works on a platform, and that is a
      # question only a complete run answers.
      - name: Test
        run: cargo test --workspace --no-fail-fast

  # The declared minimum supported Rust version, built on exactly that
  # version (#164). Without this the `rust-version` in `Cargo.toml` is a
  # claim nothing checks, which is the same as no claim: a consumer finds
  # out it is wrong, not the project.
  #
  # `--all-targets` and not `cargo test`: the tests are compiled and not
  # run. Running them is the `test` job's business, on three platforms;
  # what this job asks is only whether the source still *builds* on the
  # version it advertises.
  #
  # The test targets were outside this check until they drifted out of
  # range. `cargo check --workspace` on its own compiles no test, and
  # `crates/zdc-cli/tests/fuzz.rs` came to depend on a type-inference
  # improvement newer than 1.89 without anybody choosing that: it stopped
  # compiling on the declared minimum and nothing reported it, because the
  # one job that speaks 1.89 was not looking at the tests and the three
  # jobs that compile the tests all run stable. What that buys a
  # contributor who installs the version this project asks for is a
  # `cargo test` that does not build — a worse first five minutes than any
  # consumer gets, from the number that was supposed to protect them.
  #
  # The cost is that dev-dependencies now have to clear the floor too, and
  # the reasoning here used to be that they should not have to, since
  # nobody consuming these crates compiles them. That is still true of
  # consumers and was never true of contributors, who compile the tests on
  # whatever version the manifest told them to install. Today the whole
  # graph clears 1.89 with room, so the trade costs nothing. If a
  # dev-dependency ever raises its own floor past it, drop `--all-targets`
  # rather than raising `rust-version` — a consumer should not pay for a
  # test-only dependency — and name the crate that did it here.
  #
  # The toolchain is pinned to the literal version rather than read from
  # the manifest so that a bump has to be written down in both places by
  # somebody who meant it.
  #
  # One platform, unlike `test`. The floor is the highest `rust-version`
  # in the dependency graph, and a crate declares that once rather than
  # per target, so building it on three runners would ask the same
  # question three times. A dependency that raised its floor on one
  # platform only would slip past this — that has not happened, and if it
  # ever does the honest fix is to matrix this job then, with the crate
  # that did it named in a comment.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: The declared minimum is the real minimum
        run: |
          declared="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          if [ "$declared" != "1.89" ]; then
            echo "Cargo.toml declares $declared but this job pins 1.89." >&2
            echo "Change both, or neither." >&2
            exit 1
          fi
          cargo check --workspace --all-targets --all-features

  # The external dependency plan *The Case for Memory Safe Roadmaps*
  # (CISA/NSA/FBI et al., December 2023) asks a roadmap to include, as a
  # gate. Kept out of `check` so a supply-chain failure is legible on its
  # own rather than hidden behind a compile error.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Advisory exceptions agree and are explained
        run: ./scripts/check-advisory-exceptions.sh
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Every check in `deny.toml` is already set to `deny`. `--deny
      # warnings` additionally fails on an allow-listed licence that
      # nothing in the graph uses, which is a licence nobody has looked
      # at since it was added.
      - name: Dependency policy
        run: cargo deny --all-features check --deny warnings
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # `--deny warnings` is what makes an unmaintained or yanked crate
      # fail rather than scroll past.
      - name: Known vulnerabilities
        run: cargo audit --deny warnings

  # `cargo geiger` type-checks the whole graph with its own rustc wrapper
  # and is by some distance the slowest gate here, so it runs alone. It is
  # the only check that measures `unsafe` in code this project did not
  # write — which is where all of it is, because the code this project did
  # write forbids it.
  dependency-unsafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: Unsafe in the dependency graph
        run: ./scripts/check-dependency-unsafe.sh

  # The emitted program, loaded by something that is actually a browser
  # (#162).
  #
  # Every other JavaScript suite runs under the embedded engine, which is
  # what keeps `cargo test` the only command this workspace needs. The
  # engine is not a browser and `dom-shim.js` is not a DOM: it models no
  # HTML parser insertion modes. #205 is the bill for that. A `Paragraph`
  # holding a block element emitted a walk the shim and the emitter agreed
  # on, every parity test passed, and the page threw on load in every
  # browser — because the parser closes a `p` before a block, and two
  # halves agreeing on a tree no browser builds is a disagreement no shim
  # can report.
  #
  # One runner, unlike `test`. What is being asked here is what a browser's
  # HTML parser and DOM do, and that is a property of the engine rather
  # than of the operating system under it — the same argument `msrv` makes
  # for running once. Chromium is what ubuntu-latest already has; a second
  # engine would be a real addition rather than a repetition, and Firefox
  # is the one worth adding first if this ever finds an engine-specific
  # answer.
  #
  # `--ignored` is what makes the browser optional locally and mandatory
  # here. The tests are `#[ignore]`d so that `cargo test` still passes for
  # somebody who has not installed a browser, and this job is the reason
  # that is not the same as nobody running them.
  browser:
    runs-on: ubuntu-latest
    # A browser is the one thing in this workflow that can wait forever,
    # and on this job's first run it did: forty minutes on a page whose
    # fetches the test's own server never answered, ended by hand. The
    # test kills its browser after a minute now, so reaching this limit
    # means the hang moved somewhere the test cannot see — which is still
    # a failure, and not a six-hour bill.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      # Named explicitly rather than discovered, so a runner image that
      # stops shipping a browser fails this job instead of quietly skipping
      # the only tests that speak for one.
      #
      # `google-chrome` is preferred over `chromium` because on Ubuntu the
      # latter is a snap, and a confined snap cannot read a profile
      # directory outside `$HOME`. It does not report that: it exits having
      # written nothing, which reads as a page that failed to render. The
      # chosen path is echoed and pinned so the log says which browser
      # answered rather than leaving it to be inferred.
      - name: The runner has a browser
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if path="$(command -v "$candidate")"; then
              echo "using $path"
              "$path" --version || true
              echo "ZDC_BROWSER=$path" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no browser on this runner; install one or pin ZDC_BROWSER" >&2
          exit 1
      - name: Browser tests
        run: cargo test -p zdc-cli --test browser -- --ignored --nocapture

  # The one regression a byte count cannot see (#165).
  #
  # Every deterministic gate in this repository weighs output, and a pass
  # can become arbitrarily slower without changing one byte of it. #8 is
  # the worked example: the emitter's path scheduler was cubic in the size
  # of a region — 1,866 ms to schedule 1,025 view nodes — and the walk it
  # scheduled came out byte-identical throughout, so `cargo test` was green
  # for as long as the code was in the tree.
  #
  # What is asserted is a *shape*, not a time:
  # `crates/zdc-bench/tests/asymptotics.rs` sweeps program size 16× and
  # compares cost per node at the two ends. That ratio is taken inside one
  # process on one machine, so a slow or loaded runner multiplies both
  # terms and cancels — which is what makes this a gate that can live in CI
  # rather than an absolute budget that would teach everyone to re-run
  # until green. The file argues the choice and lists what was rejected.
  #
  # Its own job, and for the same two reasons `browser` has one. `--release`,
  # because a debug build measures the compiler's missing inlining rather
  # than the emitter's order of growth, and the `test` matrix is a debug
  # build on three platforms. And `--ignored`, which is what makes the
  # sweep optional on a laptop and mandatory here — it costs tens of
  # seconds, most of them in the one pass this exists to watch.
  #
  # One runner. An order of growth is a property of the algorithm, and the
  # constant factor that does differ between platforms is precisely the one
  # a ratio divides out; three runners would ask the same question three
  # times and pay for it in the slowest measurement here.
  asymptotics:
    runs-on: ubuntu-latest
    # Bounded for the same reason `browser` is. On this base the sweep's
    # largest point costs seconds per sample by itself, so a pass that
    # regressed by another order of growth would not fail this job — it
    # would hang it, and an unbounded hang is a six-hour bill rather than a
    # red cross.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: asymptotics
      - name: Growth gates
        run: |
          cargo test -p zdc-bench --release --test asymptotics -- \
            --ignored --nocapture

  # Whether the tests can fail (#160).
  #
  # `check` already runs `scripts/check-vacuous-tests.py`, which reads test
  # source for two shapes that cannot fail. It is a static gate and it
  # catches what it knows about. What it cannot see is a test that has
  # every shape of a real test and measures something else, and this
  # repository found four of those in a day — a gate that located a
  # function's end by the first `}` in column 0, a gate that matched a
  # comment to a call by adjacency, a latency figure that subtracted two
  # runs compiling different programs, and a test asserting a page mounted
  # against a page that threw on its first line. All four were green
  # throughout. The only thing that finds that class is changing the
  # subject and watching for red.
  #
  # `crates/zdc-runtime/tests/mutation.rs` does that to the runtime's
  # JavaScript, which is the part of the compiler's output that is data:
  # every suite takes the module source as an argument, so a mutant is a
  # string edit and a fresh engine rather than a rebuild. Its scope is
  # written down in that file and is deliberately one crate wide.
  #
  # Its own job, and `#[ignore]`d, on exactly the terms the browser suite
  # is: two hundred and thirty-six mutants, each a fresh engine running a
  # whole suite, is minutes rather than seconds, and `cargo test` has to
  # stay a command a contributor runs without thinking about the cost.
  # `--ignored` here is what stops that being the same as nobody running
  # it. The two tests in that file that are *not* ignored — every module is
  # reached, and the masking still holds — run in `test` with everything
  # else, because they take four seconds.
  #
  # Debug and not `--release`, unlike the benchmark suites. The sweep is an
  # interpreter's work and an optimised `boa` would run it several times
  # faster, but a release build of this graph is minutes of compilation
  # that the `test` job's cache cannot share, so the two roughly cancel —
  # and a debug build is what every other job here measures, which is one
  # fewer thing to explain when a timing changes.
  #
  # `--nocapture` because the interesting output is on the passing path:
  # the run prints every surviving mutant by name, and a survivor is a
  # finding about the tests whether or not the counts moved.
  mutation:
    runs-on: ubuntu-latest
    # The harness bounds every mutant's loops itself, for the reason its
    # `LOOP_BUDGET` records: a boundary flip is a non-termination
    # generator, and the first sweep written was abandoned by hand after
    # twenty minutes with nothing printed. Reaching this limit therefore
    # means the cost moved somewhere the bound cannot see, which is a
    # failure and not a bill.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutation
      - name: The runtime survives no mutation nobody has written down
        run: cargo test -p zdc-runtime --test mutation -- --ignored --nocapture
