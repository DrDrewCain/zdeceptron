name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Every crate forbids unsafe
        run: ./scripts/check-forbid-unsafe.sh
      - name: No wildcard match arm over a closed compiler enum
        run: ./scripts/check-wildcard-arms.sh
      - name: No test that cannot fail
        run: python3 ./scripts/check-vacuous-tests.py
      - name: No emitter writes its own quotes around a placeholder
        run: ./scripts/check-emitted-strings.sh
      - name: Editor grammar matches the lexer keyword table
        run: python3 ./scripts/check-grammar-drift.py
      # The release publishes eighteen crates in dependency order, and that
      # order is computed rather than written down. Checked here so a
      # dependency edge that makes it uncomputable fails on the pull
      # request that adds it, not half way through a release with some
      # crates already published and no way to unpublish them.
      - name: A publish order exists
        run: python3 ./scripts/publish-order.py --check
      # Default fail-fast hides every later suite behind one failure,
      # which is how a green-looking run once covered twelve broken tests.
      - name: Test
        run: cargo test --workspace --no-fail-fast

  # The declared minimum supported Rust version, built on exactly that
  # version (#164). Without this the `rust-version` in `Cargo.toml` is a
  # claim nothing checks, which is the same as no claim: a consumer finds
  # out it is wrong, not the project.
  #
  # `cargo check --workspace` and not `cargo test`: dev-dependencies are
  # not something a consumer compiles, so holding the test harness to the
  # consumer's floor would raise the floor for no one's benefit. The
  # toolchain is pinned to the literal version rather than read from the
  # manifest so that a bump has to be written down in both places by
  # somebody who meant it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: The declared minimum is the real minimum
        run: |
          declared="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          if [ "$declared" != "1.89" ]; then
            echo "Cargo.toml declares $declared but this job pins 1.89." >&2
            echo "Change both, or neither." >&2
            exit 1
          fi
          cargo check --workspace --all-features

  # The external dependency plan *The Case for Memory Safe Roadmaps*
  # (CISA/NSA/FBI et al., December 2023) asks a roadmap to include, as a
  # gate. Kept out of `check` so a supply-chain failure is legible on its
  # own rather than hidden behind a compile error.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Advisory exceptions agree and are explained
        run: ./scripts/check-advisory-exceptions.sh
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Every check in `deny.toml` is already set to `deny`. `--deny
      # warnings` additionally fails on an allow-listed licence that
      # nothing in the graph uses, which is a licence nobody has looked
      # at since it was added.
      - name: Dependency policy
        run: cargo deny --all-features check --deny warnings
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # `--deny warnings` is what makes an unmaintained or yanked crate
      # fail rather than scroll past.
      - name: Known vulnerabilities
        run: cargo audit --deny warnings

  # `cargo geiger` type-checks the whole graph with its own rustc wrapper
  # and is by some distance the slowest gate here, so it runs alone. It is
  # the only check that measures `unsafe` in code this project did not
  # write — which is where all of it is, because the code this project did
  # write forbids it.
  dependency-unsafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: Unsafe in the dependency graph
        run: ./scripts/check-dependency-unsafe.sh
