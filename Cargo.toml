[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/DrDrewCain/zdeceptron"
homepage = "https://zdeceptron.marksturman.com"
keywords = ["compiler", "reactive", "dataflow", "language"]
categories = ["compilers", "development-tools"]
# The minimum a consumer needs, and it is a fact about the dependency graph
# rather than a preference (#164). `redb`, which `zdc-store` uses for the
# durable store, declares 1.89; `boa_engine`, which `zdc-host` runs emitted
# server functions on, declares 1.88; `clap` declares 1.85. The highest of
# those is the floor, so raising it is a decision about which dependency to
# accept and not a number to pick.
#
# `ci.yml`'s `msrv` job builds on exactly this version, so this line and
# what actually compiles cannot drift. It is `cargo check` rather than
# `cargo test` there: dev-dependencies are not something a consumer builds,
# and holding the test harness to the consumer's floor would constrain the
# wrong thing.
rust-version = "1.89"

[workspace.dependencies]
logos = "0.14"
ariadne = "0.4"
clap = { version = "4.5", features = ["derive"] }

# Optimise dependencies even in debug builds, and leave this workspace's own
# crates unoptimised so they stay debuggable.
#
# Every test that executes JavaScript runs it through `boa_engine`, an
# interpreter written in Rust: the runtime suite, the emission parity tests,
# and the benchmark workload, which renders 55,000 rows. Unoptimised, that
# engine dominates `cargo test` to the point where the benchmark cannot be a
# CI gate at all (spec §14A.4 requires that it is one). Compiled at
# `opt-level = 2` it is a bounded cost.
[profile.dev.package."*"]
opt-level = 2
